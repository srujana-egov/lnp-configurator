name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  # Not run on every push — it makes real OpenAI API calls (real cost, and a
  # real live sequence against the app, not a mock), so it's manual/on-demand
  # only. Needs OPENAI_API_KEY and API_SHARED_SECRET configured as repo
  # secrets to run.
  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      API_SHARED_SECRET: ${{ secrets.API_SHARED_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run smoke
