<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>lnp-configurator harness</title>
</head>
<body>
  <h1>AI Configurator — Sprint 2 harness</h1>
  <p><em>Deliberately unstyled. All 7 domains now get real routing + extraction via the router + domain-specialist architecture.</em></p>

  <button id="newSessionBtn">New Session</button>
  <select id="templateSelect"><option value="">— start from a template —</option></select>
  <button id="startFromTemplateBtn">Start from Template</button>
  <span id="sessionLabel"></span>

  <div style="display: flex; gap: 24px; margin-top: 16px;">
    <div style="flex: 1; min-width: 360px;">
      <h2>Chat</h2>
      <div id="chatLog" style="border: 1px solid #999; height: 400px; overflow-y: auto; padding: 8px;"></div>
      <div id="chipRow" style="margin-top: 8px;"></div>
      <form id="turnForm" style="margin-top: 8px;">
        <textarea id="messageInput" rows="3" style="width: 100%;" placeholder="Type a message..."></textarea><br />
        <input id="fileInput" type="file" multiple accept="application/pdf,image/png,image/jpeg" /><br />
        <button type="submit" id="sendBtn">Send</button>
      </form>
      <button type="button" id="suggestTemplateBtn" style="margin-top: 8px;">Suggest a Template</button>
      <pre id="statusArea" style="color: red;"></pre>
    </div>

    <div style="flex: 1; min-width: 360px;">
      <h2>Application Definition</h2>
      <div id="domainTabs" style="display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px;"></div>
      <div id="domainPanel"></div>
    </div>
  </div>

<script>
let sessionId = null;
let currentDefinition = null;
let activeTab = 'registry';

const TABS = [
  { key: 'registry', label: 'Form' },
  { key: 'workflow', label: 'Workflow' },
  { key: 'roles', label: 'Roles' },
  { key: 'checklists', label: 'Checklist' },
  { key: 'fees', label: 'Fees' },
  { key: 'notifications', label: 'Notifications' },
  { key: 'otherInformation', label: 'Other Information' },
];

const chatLog = document.getElementById('chatLog');
const chipRow = document.getElementById('chipRow');
const domainTabs = document.getElementById('domainTabs');
const domainPanel = document.getElementById('domainPanel');
const statusArea = document.getElementById('statusArea');
const sessionLabel = document.getElementById('sessionLabel');
const templateSelect = document.getElementById('templateSelect');

function appendMessage(role, text) {
  const div = document.createElement('div');
  div.innerHTML = '<strong>' + role + ':</strong> ' + text.replace(/</g, '&lt;');
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

function renderChips(suggestedReplies) {
  chipRow.innerHTML = '';
  (suggestedReplies || []).forEach((reply) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = reply;
    btn.style.marginRight = '6px';
    btn.onclick = () => sendTurn(reply, []);
    chipRow.appendChild(btn);
  });
}

function fieldInput(field) {
  const notes = [];
  if (field.validationNotes) notes.push(field.validationNotes);
  if (field.optionsSource) notes.push('options from: ' + field.optionsSource);
  if (field.source) notes.push('source: ' + field.source);

  let inputHtml;
  if (field.type === 'dropdown') {
    const opts = (field.dropdownOptions || []).map((o) => '<option>' + o + '</option>').join('');
    inputHtml = '<select>' + opts + '</select>';
  } else if (field.type === 'textarea') {
    inputHtml = '<textarea rows="2"></textarea>';
  } else if (field.type === 'checkbox' || field.type === 'toggle') {
    inputHtml = '<input type="checkbox" />';
  } else if (field.type === 'file') {
    inputHtml = '<input type="file" />';
  } else {
    const htmlType = { number: 'number', date: 'date', year: 'number', phone: 'tel', email: 'email' }[field.type] || 'text';
    inputHtml = '<input type="' + htmlType + '" />';
  }

  return (
    '<div style="margin-bottom: 8px;">' +
    '<label><strong>' + field.label + '</strong>' + (field.required ? ' *' : '') +
    ' <em style="color:#666;">[' + field.type + ', ' + field.fieldSource + ']</em></label><br/>' +
    inputHtml +
    (notes.length ? '<br/><small style="color:#666;">' + notes.join(' · ') + '</small>' : '') +
    '</div>'
  );
}

function renderRegistry(registry) {
  let html = '';
  for (const section of registry.sections) {
    html += '<fieldset><legend>' + section.title + (section.system ? ' [system]' : '') + (section.conditional ? ' [conditional]' : '') + '</legend>';
    for (const field of section.fields || []) html += fieldInput(field);
    for (const sub of section.subsections || []) {
      html += '<strong>' + sub.title + '</strong>';
      for (const field of sub.fields) html += fieldInput(field);
    }
    html += '</fieldset>';
  }
  if (registry.documents.length > 0) {
    html += '<fieldset><legend>Documents</legend><ul>';
    for (const doc of registry.documents) {
      html += '<li>' + doc.documentName + ' — ' + doc.acceptedFormats.join('/') + (doc.required ? ' (required)' : ' (optional)') +
        (doc.docTypes.length ? ' — types: ' + doc.docTypes.join(', ') : '') + '</li>';
    }
    html += '</ul></fieldset>';
  }
  if (registry.featureToggles.length > 0) {
    html += '<fieldset><legend>Feature toggles</legend>';
    for (const toggle of registry.featureToggles) {
      html += '<div><input type="checkbox" ' + (toggle.enabled ? 'checked' : '') + ' /> <strong>' + toggle.label + '</strong>' +
        (toggle.tag ? ' [' + toggle.tag + ']' : '') + '<br/><small>' + toggle.description + '</small></div>';
    }
    html += '</fieldset>';
  }
  return html || '<p><em>Nothing extracted yet.</em></p>';
}

// Left-to-right layer per state = BFS hop distance from Start (or the first
// state, if none is literally named "Start"). Back-edges/self-loops are real
// in workflow data (rejection cycles, retry loops) — rather than pretend a
// left-to-right diagram is a clean DAG, they're drawn distinctly (a loop
// icon or a "back" icon) instead of a normal forward arrow.
function computeWorkflowLayers(states, transitions) {
  const adjacency = {};
  states.forEach((s) => { adjacency[s.label] = []; });
  transitions.forEach((t) => {
    if (adjacency[t.from]) adjacency[t.from].push(t.to);
  });

  const startState = states.find((s) => s.label === 'Start') || states[0];
  const distance = {};
  if (startState) {
    distance[startState.label] = 0;
    const queue = [startState.label];
    while (queue.length > 0) {
      const current = queue.shift();
      for (const next of adjacency[current] || []) {
        if (!(next in distance)) {
          distance[next] = distance[current] + 1;
          queue.push(next);
        }
      }
    }
  }
  let maxDistance = 0;
  states.forEach((s) => { if (s.label in distance) maxDistance = Math.max(maxDistance, distance[s.label]); });
  states.forEach((s) => { if (!(s.label in distance)) { maxDistance += 1; distance[s.label] = maxDistance; } });
  return distance;
}

function renderWorkflow(workflow) {
  let html = '';
  if (workflow.states.length > 0) {
    const distance = computeWorkflowLayers(workflow.states, workflow.transitions);
    const startLabel = (workflow.states.find((s) => s.label === 'Start') || workflow.states[0]).label;
    const outgoing = {};
    workflow.transitions.forEach((t) => { (outgoing[t.from] = outgoing[t.from] || []).push(t); });

    const columns = {};
    workflow.states.forEach((s) => {
      const col = distance[s.label];
      (columns[col] = columns[col] || []).push(s);
    });
    const colKeys = Object.keys(columns).map(Number).sort((a, b) => a - b);

    html += '<div style="display:flex; gap:28px; overflow-x:auto; padding:12px 4px; border:1px solid #ccc;">';
    for (const col of colKeys) {
      html += '<div style="display:flex; flex-direction:column; gap:12px; min-width:190px;">';
      for (const state of columns[col]) {
        const stateOutgoing = outgoing[state.label] || [];
        const isTerminal = stateOutgoing.length === 0;
        const isStart = state.label === startLabel;
        const borderColor = isStart ? '#3366cc' : (isTerminal ? '#2a9d5c' : '#333');
        html += '<div style="border:2px solid ' + borderColor + '; border-radius:6px; padding:8px; background:#fafafa;">';
        html += '<div style="font-weight:bold;">' + state.label +
          (isStart ? ' <span style="color:#3366cc; font-weight:normal;">(start)</span>' : '') +
          (isTerminal ? ' <span style="color:#2a9d5c; font-weight:normal;">(terminal)</span>' : '') + '</div>';
        for (const t of stateOutgoing) {
          const targetCol = distance[t.to];
          const isSelfLoop = t.to === state.label;
          const isBackEdge = !isSelfLoop && targetCol <= col;
          const arrow = isSelfLoop ? '&#8635;' : (isBackEdge ? '&#8626;' : '&rarr;');
          html += '<div style="font-size:12px; color:#555; margin-top:4px; border-top:1px dashed #ccc; padding-top:4px;">' +
            arrow + ' <strong>' + t.to + '</strong>' +
            (isBackEdge ? ' <em style="color:#a55;">(back)</em>' : '') + '<br/>' +
            (t.role || t.action
              ? '<em>' + [t.role, t.action].filter(Boolean).join(': ') + '</em>'
              : '<em style="color:#999;">no role/action</em>') +
            '</div>';
        }
        html += '</div>';
      }
      html += '</div>';
    }
    html += '</div>';
  }
  if (workflow.slaDays != null) {
    html += '<p style="margin-top:12px;"><strong>SLA:</strong> ' + workflow.slaDays + ' days</p>';
  }
  return html || '<p><em>Nothing extracted yet.</em></p>';
}

function renderRoles(roles) {
  if (roles.length === 0) return '<p><em>Nothing extracted yet.</em></p>';
  return '<ul>' + roles.map((r) => '<li>' + r + '</li>').join('') + '</ul>';
}

function renderChecklists(checklists) {
  if (checklists.length === 0) return '<p><em>Nothing extracted yet — real tenants often leave this empty.</em></p>';
  let html = '';
  for (const c of checklists) {
    html += '<fieldset><legend>' + c.name + ' [' + c.module + ', stage: ' + c.stage + ']</legend><ul>';
    for (const item of c.items) {
      html += '<li>' + item.item + ' (' + item.type + ')' + (item.required ? ' *' : '') + '</li>';
    }
    html += '</ul></fieldset>';
  }
  return html;
}

function renderFees(fees) {
  if (fees.feeComponents.length === 0 && fees.additionalComponents.length === 0) {
    return '<p><em>Nothing extracted yet.</em></p>';
  }
  let html = '<p><strong>Mode:</strong> ' + fees.mode + '</p><ul>';
  let total = 0;
  for (const c of fees.feeComponents) {
    html += '<li>' + c.label + ': ' + c.amount + '</li>';
    total += c.amount;
  }
  html += '</ul><p><strong>Subtotal: ' + total + '</strong></p>';
  if (fees.additionalComponents.length > 0) {
    html += '<ul>';
    for (const c of fees.additionalComponents) {
      html += '<li>' + c.name + ': ' + c.value + (c.type === 'percentage' ? '%' : '') + '</li>';
    }
    html += '</ul>';
  }
  return html;
}

function renderNotifications(notifications) {
  if (notifications.rules.length === 0) return '<p><em>Nothing extracted yet.</em></p>';
  return '<ul>' + notifications.rules.map((r) =>
    '<li>' + r.event + ' &rarr; ' + r.channel + ' &rarr; ' + r.recipient +
    (r.message ? '<br/><small style="color:#666;">' + r.message.replace(/</g, '&lt;') + '</small>' : '') + '</li>'
  ).join('') + '</ul>';
}

function renderOtherInformation(otherInformation) {
  let html = '';
  if (otherInformation.notes) {
    html += '<p>' + otherInformation.notes.replace(/</g, '&lt;').replace(/\n/g, '<br/>') + '</p>';
  }
  if (otherInformation.attachments.length > 0) {
    html += '<ul>' + otherInformation.attachments.map((a) =>
      '<li>' + a.filename + (a.description ? ' — ' + a.description : '') + '</li>'
    ).join('') + '</ul>';
  }
  return html || '<p><em>Nothing here yet.</em></p>';
}

const DOMAIN_RENDERERS = {
  registry: renderRegistry,
  workflow: renderWorkflow,
  roles: renderRoles,
  checklists: renderChecklists,
  fees: renderFees,
  notifications: renderNotifications,
  otherInformation: renderOtherInformation,
};

function renderTabs() {
  domainTabs.innerHTML = '';
  for (const tab of TABS) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = tab.label;
    btn.style.fontWeight = tab.key === activeTab ? 'bold' : 'normal';
    btn.onclick = () => { activeTab = tab.key; renderTabs(); renderActivePanel(); };
    domainTabs.appendChild(btn);
  }
}

function renderActivePanel() {
  if (!currentDefinition) {
    domainPanel.innerHTML = '<p><em>Start a session first.</em></p>';
    return;
  }
  const renderer = DOMAIN_RENDERERS[activeTab];
  domainPanel.innerHTML = renderer(currentDefinition[activeTab]);
}

function renderDefinition(definition) {
  currentDefinition = definition;
  renderActivePanel();
}

async function loadTemplateOptions() {
  // No list endpoint yet (one seed template only, per Sprint 2 scope) — hardcode
  // the one real id rather than build a route for a single static option.
  templateSelect.innerHTML = '<option value="">— start from a template —</option>' +
    '<option value="business-license-starter">Business License</option>';
}

async function newSession(templateId) {
  const res = await fetch('/api/sessions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(templateId ? { templateId } : {}),
  });
  const session = await res.json();
  sessionId = session.sessionId;
  sessionLabel.textContent = ' session: ' + sessionId;
  chatLog.innerHTML = '';
  chipRow.innerHTML = '';
  statusArea.textContent = '';
  renderTabs();
  renderDefinition(session.definition);
}

async function sendTurn(message, files) {
  if (!sessionId) {
    statusArea.textContent = 'Start a session first.';
    return;
  }
  statusArea.textContent = '';
  appendMessage('administrator', message || '(attached ' + files.length + ' file(s))');
  chipRow.innerHTML = '';

  const formData = new FormData();
  formData.append('message', message);
  for (const file of files) formData.append('files', file);

  const res = await fetch('/api/sessions/' + sessionId + '/turns', { method: 'POST', body: formData });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: res.statusText }));
    statusArea.textContent = 'Error ' + res.status + ': ' + (err.message || err.error);
    return;
  }
  const result = await res.json();
  appendMessage('ai', result.message.text);
  renderChips(result.message.suggestedReplies);
  renderDefinition(result.definition);
}

async function suggestTemplate() {
  if (!sessionId) {
    statusArea.textContent = 'Start a session first.';
    return;
  }
  const res = await fetch('/api/sessions/' + sessionId + '/suggest-template', { method: 'POST' });
  const { suggestion } = await res.json();
  statusArea.style.color = '#333';
  statusArea.textContent = suggestion
    ? 'Suggested template: ' + suggestion.name + ' (' + suggestion.description + ', similarity ' + suggestion.similarity + ' — stubbed matching, Sprint 5 builds the real thing)'
    : 'No template suggestion available.';
}

document.getElementById('newSessionBtn').onclick = () => newSession(undefined);
document.getElementById('startFromTemplateBtn').onclick = () => {
  if (!templateSelect.value) {
    statusArea.textContent = 'Pick a template first.';
    return;
  }
  newSession(templateSelect.value);
};
document.getElementById('suggestTemplateBtn').onclick = suggestTemplate;
document.getElementById('turnForm').onsubmit = (e) => {
  e.preventDefault();
  const message = document.getElementById('messageInput').value.trim();
  const files = Array.from(document.getElementById('fileInput').files);
  document.getElementById('messageInput').value = '';
  document.getElementById('fileInput').value = '';
  sendTurn(message, files);
};

loadTemplateOptions();
renderTabs();
</script>
</body>
</html>
